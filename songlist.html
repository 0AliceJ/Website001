<!DOCTYPE html>
<html>
    <head>
        <title>Karaoke Song List</title>
        <link rel="stylesheet" href="songstyle.css">
    </head>
    <body>
        <header>
            <h1>Karaoke Song List</h1>
            <!--<nav>
                <a href="#">Home</a>
                <a href="#quotes">Quotes</a>
            </nav>-->
        </header>

       
        <div class="main">
            <hr>

            <h1 id="songs">Songs</h1>
            <!--Changing song box-->
            <blockquote id="song">[Song Cycling Placeholder]</blockquote>
            <button onclick="changeSong()">Change Song</button>
            <hr>
            <!--input new song-->
            <form id="add-song-form">
                <input type="text" id="new-song" placeholder="Enter a song" required>
                <button type="submit">Add Quote</button>
            </form>

            <h1>Song Database</h1>
            <div id="all-songs"></div>
        </div>
        

        <script src="scriptkaraoke.js"></script>        
    </body>
    
</html>
