<!DOCTYPE html> <!--This is an HTML5 document, can only appear once-->
<html> <!--root element, defines entire document-->
    
    <head><!--has "meta" data/non-visual info of website-->
        <title>Page Title</title> <!--browser tab name-->
        <!--<link rel="stylesheet" href="style.css">-->
    </head>
    <body><!--for all visible things in website-->
        
        <h1>This is a Heading (1st)</h1>
        <p>This is a paragraph.</p>
        <p>This is another paragraph.</p>
        <!--all types of headings-->
        <h2>This is heading 2</h2>
        <h3>This is heading 3</h3>
        <h4>This is the 4th heading</h4>
        <h5>This is heading 5</h5>
        <!--URL = href-->
        <h6>This is the last, least important heading.</h6>
        <a href="https://www.w3schools.com/html/html_basic.asp">This is the link to basic HTML tags</a>
        <!--images where src = direct image link and alt = alternative text-->
        <!--
        absolute URLs = has domain name in link
        relative URLS (to current page or domain) = no domain name included (won't break when domain changes)
            beings w/ slash (/) = relative to domain
        -->
        <!--width and height
        default w/o suffix = in pixels
        can do %
        -->
        <img src="https://media.istockphoto.com/id/1469618147/photo/full-moon-with-flower.jpg?s=612x612&w=0&k=20&c=KQiHxLCxdub4ZG-BqlDhwv_BCS51YY47Q4ZU16CcBaQ=" alt="moon shining under low light behing tree branches with red fruit" width="30%" height="142">
        <!--br = line break-->
        <p>This is a <br> paragraph with a line break.</p>

    </body>
</html>
